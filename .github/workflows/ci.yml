name: Test and publish
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: playwright install --with-deps chromium
      - run: ruff check .
      - run: pytest -q
      - run: docker build -t osu-parking-bot:test .
      - name: Offline container authentication smoke test
        run: >-
          docker run --rm -t --init --network none --shm-size=1g
          --security-opt seccomp=${{ github.workspace }}/deploy/chromium-seccomp.json
          --mount type=bind,source=${{ github.workspace }}/tests/container_smoke.py,target=/tmp/container_smoke.py,readonly
          --entrypoint python osu-parking-bot:test /tmp/container_smoke.py
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/osu-parking-bot
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
          flavor: latest=false
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
