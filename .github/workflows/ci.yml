name: Test and publish
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: playwright install --with-deps chromium
      - run: ruff check .
      - name: Allow Chromium sandbox namespaces on the CI runner
        # CI-only: relax Ubuntu's AppArmor user-namespace restriction on this
        # disposable hosted VM. Chromium's own sandbox remains enabled.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify sandboxed Chromium launch
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(chromium_sandbox=True)
              try:
                  page = browser.new_page()
                  page.set_content("<title>Sandbox launch OK</title>")
                  assert page.title() == "Sandbox launch OK"
              finally:
                  browser.close()
          PY
      - run: pytest -q --maxfail=1
      - run: docker build -t osu-parking-bot:test .
      - name: Offline container authentication smoke test
        run: >-
          docker run --rm -t --init --network none --shm-size=1g
          --security-opt seccomp=${{ github.workspace }}/deploy/chromium-seccomp.json
          --mount type=bind,source=${{ github.workspace }}/tests/container_smoke.py,target=/tmp/container_smoke.py,readonly
          --entrypoint python osu-parking-bot:test /tmp/container_smoke.py
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/osu-parking-bot
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
          flavor: latest=false
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
