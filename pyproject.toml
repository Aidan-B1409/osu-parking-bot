[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "osu-parking-bot"
version = "0.1.0"
description = "Session-based OSU permit availability monitor"
requires-python = ">=3.12"
dependencies = ["playwright==1.58.0", "httpx==0.28.1", "discord.py==2.7.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
parking-bot = "parking_bot.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
